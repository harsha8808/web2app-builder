name: Build Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build ID — e.g. build-001 (must be unique per build)"
        required: true
        default: "build-001"
      website_url:
        description: "Website URL to wrap — e.g. https://yourwebsite.com"
        required: true
        default: "https://yourwebsite.com"
      app_name:
        description: "App display name shown on phone — e.g. My Awesome App"
        required: true
        default: "My Awesome App"
      package_name:
        description: "Android package name — e.g. com.yourcompany.appname (lowercase, no spaces)"
        required: true
        default: "com.yourcompany.appname"
      version_name:
        description: "App version shown to users — e.g. 1.0"
        required: false
        default: "1.0"
      version_code:
        description: "Internal version number, increment each release — e.g. 1"
        required: false
        default: "1"
      admob_app_id:
        description: "AdMob App ID — e.g. ca-app-pub-XXXXXXXXXXXXXXXX~XXXXXXXXXX"
        required: true
        default: "ca-app-pub-3940256099942544~3347511713"
      banner_unit_id:
        description: "AdMob Banner ad unit ID (leave blank to disable)"
        required: false
        default: ""
      interstitial_unit_id:
        description: "AdMob Interstitial ad unit ID (leave blank to disable)"
        required: false
        default: ""
      rewarded_unit_id:
        description: "AdMob Rewarded ad unit ID (leave blank to disable)"
        required: false
        default: ""
      app_open_unit_id:
        description: "AdMob App Open ad unit ID (leave blank to disable)"
        required: false
        default: ""
      interstitial_frequency:
        description: "Show interstitial ad every N page loads — e.g. 3"
        required: false
        default: "3"
      test_mode:
        description: "Use AdMob test ads? true during development, false for production"
        required: false
        default: "false"
      splash_bg_color:
        description: "Splash screen background color (hex) — e.g. #FFFFFF"
        required: false
        default: "#FFFFFF"
      splash_duration:
        description: "Splash screen duration in milliseconds — e.g. 2000"
        required: false
        default: "2000"
      splash_tagline:
        description: "Tagline shown on splash screen (leave blank for none)"
        required: false
        default: ""
      app_icon_url:
        description: "Direct URL to app icon PNG (512x512) — e.g. https://yoursite.com/icon.png"
        required: false
        default: ""
      splash_logo_url:
        description: "Direct URL to splash screen logo PNG (leave blank to use icon)"
        required: false
        default: ""
      google_services_url:
        description: "Direct URL to google-services.json (only needed if push=true)"
        required: false
        default: ""
      feature_flags:
        description: 'Enable/disable features — {"banner":true,"interstitial":true,"rewarded":false,"appOpen":false,"pullRefresh":true,"offline":true,"progress":true,"push":false}'
        required: false
        default: '{"banner":true,"interstitial":true,"rewarded":false,"appOpen":false,"pullRefresh":true,"offline":true,"progress":true,"push":false}'
      webhook_url:
        description: "URL to receive build status — Get a free test URL from webhook.site or pipedream.com"
        required: true
        default: "https://webhook.site/your-unique-url-here"
      webhook_secret:
        description: "Secret key to verify webhook requests — any random string e.g. my-secret-key-123"
        required: true
        default: "my-secret-key-123"

concurrency:
  group: build-${{ github.event.inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify started
        run: |
          curl -s -X POST "${{ github.event.inputs.webhook_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ github.event.inputs.webhook_secret }}" \
            -d '{"buildId":"${{ github.event.inputs.build_id }}","status":"building","step":"Runner started","progress":5}'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Validate and auto-generate package name
        run: |
          INPUT_PKG="${{ github.event.inputs.package_name }}"
          APP_NAME="${{ github.event.inputs.app_name }}"
          if echo "$INPUT_PKG" | grep -qE '^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*)+$'; then
            echo "PACKAGE_NAME=$INPUT_PKG" >> $GITHUB_ENV
            echo "Package name valid: $INPUT_PKG"
          else
            SAFE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
            if [ -z "$SAFE" ]; then SAFE="app"; fi
            AUTO_PKG="com.unbeated.${SAFE}"
            echo "PACKAGE_NAME=$AUTO_PKG" >> $GITHUB_ENV
            echo "Auto-generated package name: $AUTO_PKG (input '$INPUT_PKG' was invalid)"
          fi

      - name: Parse feature flags
        run: |
          printf '%s' '${{ github.event.inputs.feature_flags }}' > /tmp/feature_flags.json
          echo "ENABLE_BANNER=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('banner',True)).lower())")" >> $GITHUB_ENV
          echo "ENABLE_INTERSTITIAL=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('interstitial',True)).lower())")" >> $GITHUB_ENV
          echo "ENABLE_REWARDED=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('rewarded',False)).lower())")" >> $GITHUB_ENV
          echo "ENABLE_APP_OPEN=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('appOpen',False)).lower())")" >> $GITHUB_ENV
          echo "ENABLE_PULL_TO_REFRESH=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('pullRefresh',True)).lower())")" >> $GITHUB_ENV
          echo "ENABLE_OFFLINE_PAGE=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('offline',True)).lower())")" >> $GITHUB_ENV
          echo "ENABLE_PROGRESS_BAR=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('progress',True)).lower())")" >> $GITHUB_ENV
          echo "ENABLE_PUSH=$(python3 -c "import json; d=json.load(open('/tmp/feature_flags.json')); print(str(d.get('push',False)).lower())")" >> $GITHUB_ENV

      - name: Remove FCM service if push is disabled
        run: |
          python3 scripts/remove-fcm.py "${{ env.ENABLE_PUSH }}"

      - name: Download user assets
        run: |
          if [ -n "${{ github.event.inputs.app_icon_url }}" ]; then
            curl -fsSL "${{ github.event.inputs.app_icon_url }}" -o /tmp/ic_launcher_src.png
            pip install Pillow --quiet --break-system-packages
            python3 scripts/resize-icon.py
          fi
          if [ -n "${{ github.event.inputs.splash_logo_url }}" ]; then
            curl -fsSL "${{ github.event.inputs.splash_logo_url }}" -o app/src/main/res/drawable/splash_logo.png
          fi
          if [ -n "${{ github.event.inputs.google_services_url }}" ]; then
            curl -fsSL "${{ github.event.inputs.google_services_url }}" -o app/google-services.json
          fi

      - name: Write keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > keystore/release.jks
          echo "Keystore written successfully"
          ls -la keystore/release.jks

      - name: Notify injecting config
        run: |
          curl -s -X POST "${{ github.event.inputs.webhook_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ github.event.inputs.webhook_secret }}" \
            -d '{"buildId":"${{ github.event.inputs.build_id }}","status":"building","step":"Injecting configuration","progress":20}'

      - name: Inject tokens
        env:
          APP_NAME:               ${{ github.event.inputs.app_name }}
          PACKAGE_NAME:           ${{ env.PACKAGE_NAME }}
          VERSION_NAME:           ${{ github.event.inputs.version_name }}
          VERSION_CODE:           ${{ github.event.inputs.version_code }}
          WEBSITE_URL:            ${{ github.event.inputs.website_url }}
          ADMOB_APP_ID:           ${{ github.event.inputs.admob_app_id }}
          BANNER_UNIT_ID:         ${{ github.event.inputs.banner_unit_id }}
          INTERSTITIAL_UNIT_ID:   ${{ github.event.inputs.interstitial_unit_id }}
          REWARDED_UNIT_ID:       ${{ github.event.inputs.rewarded_unit_id }}
          APP_OPEN_UNIT_ID:       ${{ github.event.inputs.app_open_unit_id }}
          INTERSTITIAL_FREQUENCY: ${{ github.event.inputs.interstitial_frequency }}
          TEST_MODE:              ${{ github.event.inputs.test_mode }}
          ENABLE_BANNER:          ${{ env.ENABLE_BANNER }}
          ENABLE_INTERSTITIAL:    ${{ env.ENABLE_INTERSTITIAL }}
          ENABLE_REWARDED:        ${{ env.ENABLE_REWARDED }}
          ENABLE_APP_OPEN:        ${{ env.ENABLE_APP_OPEN }}
          ENABLE_PULL_TO_REFRESH: ${{ env.ENABLE_PULL_TO_REFRESH }}
          ENABLE_OFFLINE_PAGE:    ${{ env.ENABLE_OFFLINE_PAGE }}
          ENABLE_PROGRESS_BAR:    ${{ env.ENABLE_PROGRESS_BAR }}
          ENABLE_PUSH:            ${{ env.ENABLE_PUSH }}
          SPLASH_BG_COLOR:        ${{ github.event.inputs.splash_bg_color }}
          SPLASH_DURATION:        ${{ github.event.inputs.splash_duration }}
          SPLASH_TAGLINE:         ${{ github.event.inputs.splash_tagline }}
        run: |
          echo "--- Token injection env check ---"
          echo "APP_NAME=$APP_NAME"
          echo "PACKAGE_NAME=$PACKAGE_NAME"
          echo "WEBSITE_URL=$WEBSITE_URL"
          echo "ADMOB_APP_ID=$ADMOB_APP_ID"
          echo "ENABLE_PUSH=$ENABLE_PUSH"
          node scripts/inject-tokens.js

      - name: Apply package name
        env:
          PACKAGE_NAME: ${{ env.PACKAGE_NAME }}
        run: node scripts/apply-package.js

      - name: Notify building
        run: |
          curl -s -X POST "${{ github.event.inputs.webhook_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ github.event.inputs.webhook_secret }}" \
            -d '{"buildId":"${{ github.event.inputs.build_id }}","status":"building","step":"Building APK and AAB","progress":35}'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$(pwd)/keystore/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASS }}"

      - name: Build AAB
        run: |
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/keystore/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASS }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASS }}"

      - name: Notify packaging
        run: |
          curl -s -X POST "${{ github.event.inputs.webhook_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ github.event.inputs.webhook_secret }}" \
            -d '{"buildId":"${{ github.event.inputs.build_id }}","status":"building","step":"Packaging APK + AAB into ZIP","progress":75}'

      - name: Package APK + AAB into ZIP
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          VERSION="${{ github.event.inputs.version_name }}"
          SAFE_NAME="${APP_NAME// /_}"
          PKG_NAME="${{ env.PACKAGE_NAME }}"

          # APK — Gradle already signs + zipaligns when -P signing flags are passed
          APK_FOUND=$(find app/build/outputs/apk/release/ -name "app-release.apk" | head -1)
          if [ -z "$APK_FOUND" ]; then
            echo "ERROR: app-release.apk not found!"
            find app/build/outputs/apk/ -name "*.apk"
            exit 1
          fi
          APK_FINAL="/tmp/${SAFE_NAME}_v${VERSION}.apk"
          cp "$APK_FOUND" "$APK_FINAL"
          echo "APK ready: $APK_FINAL ($(du -h $APK_FINAL | cut -f1))"

          # AAB
          AAB_FOUND=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -1)
          AAB_FINAL="/tmp/${SAFE_NAME}_v${VERSION}.aab"
          cp "$AAB_FOUND" "$AAB_FINAL"
          echo "AAB ready: $AAB_FINAL ($(du -h $AAB_FINAL | cut -f1))"

          # README
          {
            echo "${APP_NAME} v${VERSION}"
            echo "Built by Unbeated Web2App Builder - https://unbeated.com"
            echo ""
            echo "APP DETAILS:"
            echo "  App Name:     ${APP_NAME}"
            echo "  Package Name: ${PKG_NAME}"
            echo "  Version:      ${VERSION}"
            echo ""
            echo "FILES INCLUDED:"
            echo "  ${SAFE_NAME}_v${VERSION}.apk  - Install directly on any Android device"
            echo "  ${SAFE_NAME}_v${VERSION}.aab  - Upload to Google Play Store"
            echo ""
            echo "HOW TO INSTALL APK ON YOUR PHONE:"
            echo "  1. Transfer APK to your Android phone (USB, email, WhatsApp)"
            echo "  2. On phone: Settings > Security > Enable Install unknown apps"
            echo "  3. Open the APK file and tap Install"
            echo ""
            echo "HOW TO PUBLISH AAB TO GOOGLE PLAY STORE:"
            echo "  1. Go to https://play.google.com/console"
            echo "  2. Create a new app — use package name: ${PKG_NAME}"
            echo "  3. Go to Release > Production > Create new release"
            echo "  4. Upload the .aab file and submit for review"
            echo ""
            echo "Need help? Visit https://unbeated.com"
          } > /tmp/README.txt

          # ZIP
          ZIP_NAME="${SAFE_NAME}_v${VERSION}.zip"
          ZIP_PATH="/tmp/${ZIP_NAME}"
          cd /tmp && zip "$ZIP_NAME" \
            "${SAFE_NAME}_v${VERSION}.apk" \
            "${SAFE_NAME}_v${VERSION}.aab" \
            "README.txt"

          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV
          echo "ZIP_FILENAME=$ZIP_NAME" >> $GITHUB_ENV
          ls -lh /tmp/*.apk /tmp/*.aab /tmp/*.zip

      - name: Notify uploading
        run: |
          curl -s -X POST "${{ github.event.inputs.webhook_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ github.event.inputs.webhook_secret }}" \
            -d '{"buildId":"${{ github.event.inputs.build_id }}","status":"building","step":"Uploading to storage","progress":88}'

      - name: Upload ZIP to R2
        run: |
          OBJECT_KEY="builds/${{ github.event.inputs.build_id }}/${{ env.ZIP_FILENAME }}"
          HTTP_CODE=$(curl -s -o /tmp/r2_response.txt -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/r2/buckets/${{ secrets.R2_BUCKET_NAME }}/objects/${OBJECT_KEY}" \
            -H "Authorization: Bearer ${{ secrets.CF_R2_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${{ env.ZIP_PATH }}")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "R2 upload failed with HTTP $HTTP_CODE"
            cat /tmp/r2_response.txt
            exit 1
          fi
          echo "DOWNLOAD_URL=${{ secrets.R2_PUBLIC_DOMAIN }}/${OBJECT_KEY}" >> $GITHUB_ENV
          echo "OBJECT_KEY=$OBJECT_KEY" >> $GITHUB_ENV

      - name: Notify complete
        if: success()
        run: |
          PAYLOAD=$(printf '{"buildId":"%s","status":"complete","step":"Build complete","progress":100,"downloadUrl":"%s","objectKey":"%s","zipFilename":"%s","completedAt":"%s"}' \
            "${{ github.event.inputs.build_id }}" \
            "${{ env.DOWNLOAD_URL }}" \
            "${{ env.OBJECT_KEY }}" \
            "${{ env.ZIP_FILENAME }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ github.event.inputs.webhook_secret }}" | awk '{print $2}')
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ github.event.inputs.webhook_url }}" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${{ github.event.inputs.webhook_secret }}" \
              -H "X-Signature-SHA256: sha256=${SIG}" \
              -d "$PAYLOAD")
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || [ "$CODE" = "204" ]; then
              echo "Webhook delivered (HTTP $CODE) on attempt $i"
              break
            fi
            echo "Attempt $i got HTTP $CODE — retrying in $((i * 15))s..."
            sleep $((i * 15))
            if [ "$i" = "5" ]; then
              echo "Webhook failed after 5 attempts — build is uploaded, continuing."
            fi
          done

      - name: Notify failed
        if: failure()
        run: |
          PAYLOAD=$(printf '{"buildId":"%s","status":"failed","step":"Build failed","progress":0,"error":"Build failed. Logs: %s/actions/runs/%s"}' \
            "${{ github.event.inputs.build_id }}" \
            "${{ github.server_url }}/${{ github.repository }}" \
            "${{ github.run_id }}")
          SIG=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ github.event.inputs.webhook_secret }}" | awk '{print $2}')
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ github.event.inputs.webhook_url }}" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${{ github.event.inputs.webhook_secret }}" \
              -H "X-Signature-SHA256: sha256=${SIG}" \
              -d "$PAYLOAD")
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || [ "$CODE" = "204" ]; then
              echo "Failure webhook delivered (HTTP $CODE) on attempt $i"
              break
            fi
            echo "Attempt $i got HTTP $CODE — retrying in $((i * 15))s..."
            sleep $((i * 15))
          done

      - name: Cleanup
        if: always()
        run: |
          rm -f keystore/release.jks keystore.properties
          rm -f /tmp/*.apk /tmp/*.aab /tmp/*.zip /tmp/README.txt /tmp/feature_flags.json /tmp/r2_response.txt
